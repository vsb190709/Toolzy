name: Toolzy QA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run Toolzy 1.36 QA
        run: node --experimental-default-type=module scripts/qa.mjs
